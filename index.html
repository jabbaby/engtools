<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<meta name="description" content="Reinforcement and concrete inspection reference tool to AS 3600:2018">
<title>Concrete Companion v1.0</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  /* light theme (default) */
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --surface-2:#F0EDE6;
  --surface-3:#E7E2D8;
  --border:#DBD5C8;
  --border-soft:#E8E3D9;
  --text:#181A1C;
  --text-dim:#565C62;
  --text-faint:#868D94;
  --amber-fill:#F5A623;
  --amber-ink:#9A5A0E;
  --amber-tint:rgba(154,90,14,0.12);
  --amber-dim:#D9B26B;
  --pass:#1F8F5E;
  --fail:#C93338;
  --hold:#A6790A;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
[data-theme="dark"]{
  --bg:#121416;
  --surface:#1A1D20;
  --surface-2:#20242A;
  --surface-3:#272C33;
  --border:#333A42;
  --border-soft:#262B31;
  --text:#F2F0EB;
  --text-dim:#A7AFB8;
  --text-faint:#6E7680;
  --amber-fill:#F5A623;
  --amber-ink:#F5A623;
  --amber-tint:rgba(245,166,35,0.1);
  --amber-dim:#8A5E1E;
  --pass:#3FB27F;
  --fail:#E5484D;
  --hold:#E8B93B;
}
body{transition:background-color .15s, color .15s;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
#app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

/* ---------- Header ---------- */
header.top{
  padding: calc(14px + var(--safe-top)) 16px 12px;
  background:var(--bg);
  border-bottom:1px solid var(--border-soft);
  flex-shrink:0;
}
.brand{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand .id{display:flex; align-items:center; gap:10px;}
.theme-toggle{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  color:var(--text-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.theme-toggle svg{width:18px; height:18px;}
.brand .mark{width:30px; height:30px; border-radius:50%; border:2.5px solid var(--amber-fill); position:relative; flex-shrink:0;}
.brand .mark::after{content:""; position:absolute; inset:9px; background:var(--amber-fill); border-radius:50%;}
.brand h1{font-size:17px; margin:0; font-weight:700; letter-spacing:0.2px;}
.brand .sub{font-size:11px; color:var(--text-faint); margin-top:1px; font-family:var(--mono); letter-spacing:0.3px;}
.module-switch{display:flex; gap:6px; margin-top:12px;}
.module-switch button{
  flex:1; padding:11px 6px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:600;
  font-family:var(--sans); cursor:pointer;
}
.module-switch button.active{background:var(--amber-fill); border-color:var(--amber-fill); color:#1A1200;}

/* ---------- Sub nav (chips) ---------- */
.subnav{display:flex; gap:8px; overflow-x:auto; padding:12px 16px 0; flex-shrink:0; scrollbar-width:none;}
.subnav::-webkit-scrollbar{display:none;}
.subnav button{
  white-space:nowrap; padding:9px 14px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:600; font-family:var(--sans);
}
.subnav button.active{background:var(--surface-3); border-color:var(--amber-ink); color:var(--amber-ink);}

/* ---------- Main content ---------- */
main{flex:1; overflow-y:auto; padding:16px 16px calc(24px + var(--safe-bottom)); -webkit-overflow-scrolling:touch;}
.view{display:none;}
.view.active{display:block; animation:fade .15s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}

.card{background:var(--surface); border:1px solid var(--border-soft); border-radius:14px; padding:16px; margin-bottom:14px;}
.card h2{font-size:15px; margin:0 0 4px; font-weight:700;}
.card .clause{font-family:var(--mono); font-size:11px; color:var(--amber-ink); background:var(--amber-tint); padding:2px 8px; border-radius:6px; display:inline-block; margin-bottom:10px;}
.card p.desc{font-size:13px; color:var(--text-dim); line-height:1.5; margin:0 0 12px;}

/* form controls */
label{display:block; font-size:12px; color:var(--text-dim); margin:12px 0 6px; font-weight:600;}
label:first-of-type{margin-top:0;}
select, input[type=number], input[type=text]{
  width:100%; padding:13px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:16px; font-family:var(--mono);
}
select{font-family:var(--sans); appearance:none; background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A7AFB8' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e"); background-repeat:no-repeat; background-position:right 12px center; padding-right:36px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.seg{display:flex; gap:6px; margin-top:6px;}
.seg button{flex:1; padding:12px 6px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-size:13px; font-weight:600;}
.seg button.on{background:var(--amber-fill); border-color:var(--amber-fill); color:#1A1200;}

.result{margin-top:16px; padding:14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border);}
.result .big{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--amber-ink); line-height:1.15;}
.result .label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:2px;}
.result .verdict{margin-top:10px; font-weight:700; font-size:14px; padding:8px 10px; border-radius:8px;}
.verdict.ok{background:rgba(63,178,127,0.15); color:var(--pass);}
.verdict.bad{background:rgba(229,72,77,0.15); color:var(--fail);}
.subresult{display:flex; justify-content:space-between; font-size:13px; color:var(--text-dim); padding:6px 0; border-top:1px dashed var(--border-soft); font-family:var(--mono);}
.subresult span:last-child{color:var(--text);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:8px 6px; text-align:right; border-bottom:1px solid var(--border-soft); font-family:var(--mono);}
th:first-child,td:first-child{text-align:left; font-family:var(--sans); font-weight:600;}
th{color:var(--text-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.3px;}
.table-wrap{overflow-x:auto; margin:0 -4px;}
tr.hi td{color:var(--amber-ink); font-weight:700;}

.disclaimer{
  display:flex; gap:10px; align-items:flex-start; padding:12px 14px; background:rgba(245,166,35,0.08);
  border:1px solid var(--amber-dim); border-radius:12px; margin-bottom:16px; font-size:12px; color:var(--text-dim); line-height:1.5;
}
.disclaimer .ic{color:var(--amber-ink); font-weight:800; font-size:16px; flex-shrink:0;}

.accordion{border:1px solid var(--border-soft); border-radius:12px; margin-bottom:10px; overflow:hidden; background:var(--surface);}
.accordion .head{padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.accordion .head h3{margin:0; font-size:14px; font-weight:700;}
.accordion .head .chev{color:var(--text-faint); transition:transform .15s;}
.accordion.open .chev{transform:rotate(180deg);}
.accordion .body{display:none; padding:0 16px 16px; font-size:13px; color:var(--text-dim); line-height:1.6;}
.accordion.open .body{display:block;}
.accordion .body b{color:var(--text); font-weight:700;}
.accordion .body .tag{display:inline-block; font-family:var(--mono); font-size:10px; color:var(--amber-ink); background:var(--amber-tint); padding:2px 6px; border-radius:5px; margin-bottom:6px;}

/* checklist */
.chk-group{margin-bottom:18px;}
.chk-group > h2{font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-faint); margin:0 0 10px; padding-left:2px;}
.chk-item{background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:14px; margin-bottom:10px;}
.chk-item .q{font-size:14px; font-weight:600; margin-bottom:10px;}
.status-btns{display:flex; gap:6px;}
.status-btns button{flex:1; padding:11px 4px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-size:12px; font-weight:700; letter-spacing:0.3px;}
.status-btns button.pass.on{background:rgba(63,178,127,0.18); border-color:var(--pass); color:var(--pass);}
.status-btns button.fail.on{background:rgba(229,72,77,0.18); border-color:var(--fail); color:var(--fail);}
.status-btns button.hold.on{background:rgba(232,185,59,0.18); border-color:var(--hold); color:var(--hold);}
.chk-item textarea{
  width:100%; margin-top:10px; padding:10px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:13px; font-family:var(--sans); resize:vertical; min-height:38px;
}
.chk-summary{display:flex; gap:8px; margin-bottom:14px;}
.chk-summary .pill{flex:1; text-align:center; padding:10px 4px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border-soft);}
.chk-summary .pill .n{font-family:var(--mono); font-size:20px; font-weight:700;}
.chk-summary .pill .l{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.4px;}
.chk-summary .pill.pass .n{color:var(--pass);} .chk-summary .pill.fail .n{color:var(--fail);} .chk-summary .pill.hold .n{color:var(--hold);}
.btnrow{display:flex; gap:8px; margin-top:4px;}
.btn{flex:1; padding:13px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-weight:700; font-size:13px;}
.btn.primary{background:var(--amber-fill); border-color:var(--amber-fill); color:#1A1200;}
.btn.danger{color:var(--fail); border-color:var(--fail);}

/* bottom tab bar */
nav.tabs{
  display:flex; flex-shrink:0; background:var(--surface); border-top:1px solid var(--border-soft);
  padding-bottom:var(--safe-bottom);
}
nav.tabs button{
  flex:1; background:none; border:none; padding:10px 4px calc(8px); color:var(--text-faint);
  display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; font-weight:600; font-family:var(--sans);
}
nav.tabs button.active{color:var(--amber-ink);}
nav.tabs svg{width:22px; height:22px;}

.hint{font-size:11px; color:var(--text-faint); margin-top:8px; line-height:1.5;}
.searchbox{margin-bottom:12px;}
.pillrow{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px;}
.pillrow .pl{font-family:var(--mono); font-size:11px; padding:5px 9px; border-radius:7px; background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text-dim);}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand">
      <div class="id">
        <div class="mark"></div>
        <div>
          <h1>Concrete Companion</h1>
          <div class="sub">V1.0 · AS 3600:2018 FIELD REFERENCE</div>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme"></button>
    </div>
    <div class="module-switch" id="moduleSwitch">
      <button data-module="reo" class="active">Reinforcement</button>
      <button data-module="conc">Concrete</button>
      <button data-module="chk">Checklist</button>
    </div>
  </header>

  <div class="subnav" id="subnavReo">
    <button data-view="reoTables" class="active">Bar &amp; Mesh Tables</button>
    <button data-view="astCalc">Ast Check</button>
    <button data-view="spacingCalc">Spacing</button>
    <button data-view="lapCalc">Lap Length</button>
    <button data-view="devCalc">Development Length</button>
  </div>

  <div class="subnav" id="subnavConc" style="display:none;">
    <button data-view="coverGuide" class="active">Cover Guide</button>
    <button data-view="defectLib">Defect Library</button>
  </div>

  <main id="main"></main>

  <nav class="tabs" id="tabs">
    <button data-module="reo" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M12 4v2.4M12 17.6V20M20 12h-2.4M6.4 12H4"/></svg>
      Reinforcement
    </button>
    <button data-module="conc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l4-11 4 6 3-8 4 13"/><path d="M3 21h18"/></svg>
      Concrete
    </button>
    <button data-module="chk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12l2 2 4-4M8 17h5"/></svg>
      Checklist
    </button>
  </nav>

</div>

<script>
/* =====================================================================
   DATA
===================================================================== */
const BARS = [
  {size:10, area:80},
  {size:12, area:110},
  {size:16, area:200},
  {size:20, area:310},
  {size:24, area:450},
  {size:28, area:610},
  {size:32, area:800},
  {size:36, area:1020},
  {size:40, area:1250},
];
const SQUARE_MESH = [
  {name:'SL52', dia:4.77, cts:200, ast:89},
  {name:'SL62', dia:6.00, cts:200, ast:141},
  {name:'SL72', dia:6.75, cts:200, ast:179},
  {name:'SL82', dia:7.60, cts:200, ast:227},
  {name:'SL92', dia:8.60, cts:200, ast:290},
  {name:'SL102', dia:9.50, cts:200, ast:354},
  {name:'SL81', dia:7.60, cts:100, ast:454},
];
const RECT_MESH = [
  {name:'RL718', longDia:6.75, longCts:100, longAst:358, crossDia:7.60, crossCts:200, crossAst:227},
  {name:'RL818', longDia:7.60, longCts:100, longAst:454, crossDia:7.60, crossCts:200, crossAst:227},
  {name:'RL918', longDia:8.60, longCts:100, longAst:581, crossDia:7.60, crossCts:200, crossAst:227},
  {name:'RL1018', longDia:9.50, longCts:100, longAst:709, crossDia:7.60, crossCts:200, crossAst:227},
  {name:'RL1118', longDia:10.70, longCts:100, longAst:899, crossDia:7.60, crossCts:200, crossAst:227},
  {name:'RL1218', longDia:11.90, longCts:100, longAst:1112, crossDia:7.60, crossCts:200, crossAst:227},
];
const SPACINGS = [100,125,150,175,200,225,250,275,300,350,400];

const COVER_TABLE = { // Table 4.10.3.2 - standard formwork & compaction, required cover (mm) vs f'c (MPa)
  fc: [20,25,32,40,50],
  rows: [
    {ec:'A1', vals:[20,20,20,20,20]},
    {ec:'A2', vals:[50,30,25,20,20], bracket:[true,false,false,false,false]},
    {ec:'B1', vals:[null,60,40,30,25], bracket:[false,true,false,false,false]},
    {ec:'B2', vals:[null,null,65,45,35], bracket:[false,false,true,false,false]},
    {ec:'C1', vals:[null,null,null,70,50], bracket:[false,false,false,true,false]},
    {ec:'C2', vals:[null,null,null,null,65], bracket:[false,false,false,false,false]},
  ]
};

const COVER_ENV = [
  {env:'Internal', ec:'A1', cover:'20 mm', fc:"f'c ≥ 20 MPa", note:'Enclosed, dry environment — no direct exposure to weather or ground moisture.'},
  {env:'External — sheltered', ec:'A2', cover:'20–25 mm', fc:"f'c ≥ 25–32 MPa", note:'Above-ground, protected from direct wetting (e.g. under eaves, in a dry inland climate).'},
  {env:'External — exposed to weather', ec:'B1', cover:'30–40 mm', fc:"f'c 32–40 MPa", note:'Above-ground surfaces directly exposed to weather, more than ~1 km from a coastline.'},
  {env:'Marine (near-coastal, <1 km)', ec:'B2 (C1/C2 in splash/tidal zones)', cover:'45–65 mm', fc:"f'c 32–40 MPa", note:'Splash, tidal or spray-zone elements are typically C1/C2 and need higher cover/strength — confirm with the durability specification.'},
  {env:'In-ground', ec:'B1, or per soil/geotech report', cover:'≥ 50 mm', fc:"f'c ≥ 32 MPa", note:'Cl 4.10.3.5 requires added cover for concrete cast directly against ground without a membrane. Confirm soil aggressivity per AS 2159 / project geotech report.'},
  {env:'Swimming pool', ec:'B2, or C1 if chlorinated/saline', cover:'45–50 mm', fc:"f'c ≥ 40 MPa", note:'Pool environments are chemically aggressive. Confirm classification with the specifier — refer to AS 3735 for pool-specific detailing.'},
];

const DEFECTS = [
  {
    name:'Honeycombing', tag:'Voids / compaction defect',
    desc:'Coarse aggregate exposed at the surface with mortar missing from between the stones, leaving visible interconnected voids.',
    causes:'Poor compaction or vibration, congested reinforcement restricting concrete flow, incorrect mix design (too stiff / harsh mix), formwork leakage (grout loss), excessive drop height causing segregation.',
    id:'Visual — rough, stony surface with visible voids; can often be seen right after strike; tap test may sound hollow over deeper honeycombing.',
    remediation:'Assess depth and extent — minor surface honeycombing may be patched per specification; honeycombing affecting cover to reinforcement or structural depth requires engineer assessment before any repair, per project remedial-works procedure.'
  },
  {
    name:'Cold joints', tag:'Placement / sequencing defect',
    desc:'A visible line or plane of weakness where a concrete placement was interrupted long enough for the earlier layer to lose plasticity before the next layer was placed.',
    causes:'Delays in supply or placement, inadequate planning of pour sequence, insufficient workforce or pump capacity for the placement rate, premature loss of workability of the mix.',
    id:'Visible discontinuity line on the surface, difference in colour/texture either side of the joint, potential water ingress path.',
    remediation:'Location and structural significance to be assessed by the engineer; may require coring/testing to confirm bond, and treatment (e.g. surface sealing, resin injection) per specifier\'s direction — not a standard finish defect.'
  },
  {
    name:'Plastic shrinkage cracking', tag:'Early-age cracking',
    desc:'Fine, random or map-pattern cracks appearing in the surface within the first few hours after placement, before the concrete has set.',
    causes:'Rapid moisture loss from the surface exceeding bleed rate — high wind, low humidity, high concrete/ambient temperature, direct sun, no early curing.',
    id:'Shallow, irregular cracks (often <300 mm long) visible within hours of placement, typically not full-depth.',
    remediation:'Generally cosmetic if shallow — confirm depth; ensure curing regime is corrected for subsequent pours (windbreaks, fogging, curing compound applied promptly). Structural elements: engineer to confirm no impact on durability/cover.'
  },
  {
    name:'Thermal cracking', tag:'Early-age cracking',
    desc:'Cracking caused by differential temperature/volume change between the hot concrete core (from cement hydration heat) and the cooler, restrained surface or adjacent older concrete.',
    causes:'High cement content / large pour volumes, insufficient control of peak core temperature or temperature differential, inadequate curing/insulation, restraint from adjoining elements or formwork.',
    id:'Cracks typically appear at 1–7 days, can be through-section in mass pours; often aligned with restraint points or re-entrant corners.',
    remediation:'Engineer to review crack width, depth and location against durability/serviceability requirements; may require monitoring, injection, or no action if within acceptable limits.'
  },
  {
    name:'Structural cracking', tag:'Load-related cracking',
    desc:'Cracking related to applied loads or restraint of imposed deformation, distinct from early-age shrinkage/thermal cracking — includes flexural, shear and settlement cracking.',
    causes:'Design load exceedance, premature loading/stripping of formwork, differential settlement of formwork or foundations, unplanned construction loading.',
    id:'Crack pattern and orientation consistent with stress trajectories (e.g. flexural cracks perpendicular to span, diagonal shear cracks); often wider or progressive compared with shrinkage cracking.',
    remediation:'Always requires engineer assessment before any remedial action or further loading — do not classify or approve on-site without structural review.'
  },
  {
    name:'Segregation', tag:'Placement / mix defect',
    desc:'Separation of coarse aggregate from the mortar matrix, or of the constituent materials generally, resulting in non-uniform concrete.',
    causes:'Excessive free-fall height, over-vibration, poorly proportioned or overly wet mix, transport/handling issues (e.g. long pump lines, chute segregation).',
    id:'Visible aggregate concentration in one area (often at base of pour or lift face), sandy/weak surface layer, variation in colour or texture.',
    remediation:'Extent and depth to be assessed by engineer; may require removal and replacement of affected concrete, or patch repair for minor surface segregation, per remedial specification.'
  },
  {
    name:'Form-face blemishes', tag:'Surface finish defect',
    desc:'Surface imperfections replicating formwork condition or release performance — blowholes, grain marks, discolouration, form-tie marks, or ridging at panel joins.',
    causes:'Poor formwork condition or cleanliness, inconsistent or excessive release agent application, formwork panel misalignment, air entrapment against the form face during placement/compaction.',
    id:'Visual inspection of stripped surface against the specified finish class (e.g. off-form Class 1/2/3 per project spec).',
    remediation:'Compare against the contracted finish class; if non-compliant, remediation (grinding, patching, bagging) per the finishes specification — generally a cosmetic/durability issue, not structural, unless blemishes are deep enough to reduce cover.'
  },
  {
    name:'Delamination', tag:'Surface / near-surface defect',
    desc:'Separation of a thin surface layer of concrete (typically the top 5–20 mm of a slab) from the substrate, forming a void plane parallel to the surface.',
    causes:'Premature or incorrect finishing sealing bleed water beneath the surface, excessive early trowelling, entrapped air rising during finishing, inconsistent mix bleed characteristics.',
    id:'Hollow sound on chain-drag or tap test; often not visible until the surface is loaded or begins to spall.',
    remediation:'Map extent with sounding survey; engineer/specifier to determine repair method (e.g. resin injection, removal and patching) based on extent and service requirements.'
  },
];

const CHECKLIST_GROUPS = [
  {
    name:'Reinforcement layout',
    items:[
      'Bar sizes match approved drawings',
      'Bar spacing matches approved drawings',
      'Bar location (top/bottom mat, layer order) matches drawings',
      'Lap lengths and locations comply with drawings/details',
      'Reinforcement free of loose rust, oil, mud or other bond-reducing contamination',
    ]
  },
  {

/* =====================================================================
   CALCULATIONS
===================================================================== */
function providedAst(barArea, spacing){ return barArea*1000/spacing; }

function devLenTension({db, fc, k1, cover, spacing}){
  const fcEff = Math.min(fc, 65);
  const fsy = 500;
  const k2 = (132-db)/100;
  let cd = cover;
  if(spacing) cd = Math.min(cover, spacing/2);
  let k3 = 1.0 - 0.15*(cd-db)/db;
  k3 = Math.max(0.7, Math.min(1.0, k3));
  const calc = (0.5*k1*k3*fsy*db)/(k2*Math.sqrt(fcEff));
  const minLen = 0.058*fsy*k1*db;
  return {L: Math.max(calc,minLen), k2, k3, calc, minLen, cd};
}
function devLenCompression({db, fc}){
  const fcEff = Math.min(fc, 65);
  const fsy = 500;
  const calc = 0.22*fsy*db/Math.sqrt(fcEff);
  const minLen = 0.0435*fsy*db;
  return {L: Math.max(calc,minLen), calc, minLen};
}
function lapTension({db, fc, k1, cover, spacing, k7}){
  const dev = devLenTension({db,fc,k1,cover,spacing});
  const calc = k7*dev.L;
  const floor1 = 29*db;
  const floor2 = 300;
  return {L: Math.max(calc,floor1,floor2), dev, calc, floor1, floor2};
}
function lapCompression({db, fc}){
  const dev = devLenCompression({db,fc});
  const floor1 = 40*db;
  const floor2 = 300;
  return {L: Math.max(dev.L,floor1,floor2), dev, floor1, floor2};
}
function round5(x){ return Math.round(x/5)*5; }

function renderAstCalc(main){
  main.appendChild(disclaimer('Confirms provided reinforcement against a design requirement. Does not substitute for the structural drawings/computations — use the value or bar callout from the approved design.'));
  const c = document.createElement('div'); c.className='card';
  c.innerHTML = `
    <h2>Provided vs required Ast</h2>
    ${clauseTag('Ref. AS 3600:2018 Section 8/9')}

    <label>Reinforcement provided as</label>
    <div class="seg" id="acProvMode">
      <button class="on" data-v="spacing">Bar size @ spacing</button>
      <button data-v="count">Number of bars</button>
    </div>

    <div id="acProvSpacing">
      <label>Bar size installed</label>
      <select id="acBar">${BARS.map(b=>`<option value="${b.size}">N${b.size}</option>`).join('')}</select>
      <label>Spacing as installed (mm c/c)</label>
      <input type="number" id="acSpacing" inputmode="decimal" placeholder="e.g. 200" value="200">
    </div>
    <div id="acProvCount" style="display:none;">
      <label>Number of bars — e.g. 2 for 2/N20</label>
      <input type="number" id="acCount" inputmode="decimal" placeholder="e.g. 2" value="2">
      <label>Bar size</label>
      <select id="acBarCount">${BARS.map(b=>`<option value="${b.size}">N${b.size}</option>`).join('')}</select>
    </div>

    <label style="margin-top:18px;">Compare against</label>
    <div class="seg" id="acCompMode">
      <button class="on" data-v="value">Enter Ast value</button>
      <button data-v="ref">Bar size &amp; spacing</button>
    </div>

    <div id="acCompValue">
      <label id="acReqLabel">Design Ast required (mm²/m)</label>
      <input type="number" id="acReq" inputmode="decimal" placeholder="e.g. 550" value="550">
    </div>
    <div id="acCompRef" style="display:none;"></div>

    <div class="result" id="acResult"></div>`;
  main.appendChild(c);

  const provModeSeg = c.querySelector('#acProvMode');
  const provSpacingBox = c.querySelector('#acProvSpacing');
  const provCountBox = c.querySelector('#acProvCount');
  const bar = c.querySelector('#acBar'), sp = c.querySelector('#acSpacing');
  const count = c.querySelector('#acCount'), barCount = c.querySelector('#acBarCount');

  const compModeSeg = c.querySelector('#acCompMode');
  const compValueBox = c.querySelector('#acCompValue');
  const compRefBox = c.querySelector('#acCompRef');
  const reqLabel = c.querySelector('#acReqLabel');
  const req = c.querySelector('#acReq');

  const out = c.querySelector('#acResult');
  let provMode = 'spacing', compMode = 'value';

  function buildCompRefFields(){
    if(provMode==='spacing'){
      compRefBox.innerHTML = `
        <label>Design bar size</label>
        <select id="acRefBar">${BARS.map(b=>`<option value="${b.size}">N${b.size}</option>`).join('')}</select>
        <label>Design spacing (mm c/c)</label>
        <input type="number" id="acRefSpacing" inputmode="decimal" value="200">`;
    } else {
      compRefBox.innerHTML = `
        <label>Design number of bars</label>
        <input type="number" id="acRefCount" inputmode="decimal" value="2">
        <label>Design bar size</label>
        <select id="acRefBar">${BARS.map(b=>`<option value="${b.size}">N${b.size}</option>`).join('')}</select>`;
    }
    compRefBox.querySelectorAll('select,input').forEach(el=>el.addEventListener('input',calc));
  }

  provModeSeg.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    provMode = b.dataset.v;
    [...provModeSeg.children].forEach(x=>x.classList.toggle('on', x===b));
    provSpacingBox.style.display = provMode==='spacing' ? 'block':'none';
    provCountBox.style.display = provMode==='count' ? 'block':'none';
    compModeSeg.querySelector('[data-v="ref"]').textContent = provMode==='spacing' ? 'Bar size & spacing' : 'Bar size & count';
    reqLabel.textContent = `Design Ast required (${provMode==='spacing' ? 'mm²/m' : 'mm²'})`;
    if(compMode==='ref') buildCompRefFields();
    calc();
  });

  compModeSeg.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    compMode = b.dataset.v;
    [...compModeSeg.children].forEach(x=>x.classList.toggle('on', x===b));
    compValueBox.style.display = compMode==='value' ? 'block':'none';
    compRefBox.style.display = compMode==='ref' ? 'block':'none';
    if(compMode==='ref') buildCompRefFields();
    calc();
  });

  function getProvided(){
    if(provMode==='spacing'){
      const b = BARS.find(x=>x.size==bar.value);
      const spacing = parseFloat(sp.value)||0;
      if(spacing<=0) return null;
      return {value: providedAst(b.area, spacing), unit:'mm²/m', desc:`N${b.size} @ ${spacing} mm c/c`};
    } else {
      const n = parseFloat(count.value)||0;
      const b = BARS.find(x=>x.size==barCount.value);
      if(n<=0) return null;
      return {value: n*b.area, unit:'mm²', desc:`${n}/N${b.size}`};
    }
  }
  function getRequired(){
    if(compMode==='value'){
      const v = parseFloat(req.value)||0;
      return {value:v, unit: provMode==='spacing' ? 'mm²/m':'mm²', desc:'entered value'};
    }
    const refBar = compRefBox.querySelector('#acRefBar');
    if(!refBar) return null;
    const b = BARS.find(x=>x.size==refBar.value);
    if(provMode==='spacing'){
      const refSp = compRefBox.querySelector('#acRefSpacing');
      const spacing = parseFloat(refSp.value)||0;
      if(spacing<=0) return null;
      return {value: providedAst(b.area, spacing), unit:'mm²/m', desc:`N${b.size} @ ${spacing} mm c/c`};
    } else {
      const refCount = compRefBox.querySelector('#acRefCount');
      const n = parseFloat(refCount.value)||0;
      if(n<=0) return null;
      return {value: n*b.area, unit:'mm²', desc:`${n}/N${b.size}`};
    }
  }

  function calc(){
    const provided = getProvided();
    const required = getRequired();
    if(!provided){ out.innerHTML = '<div class="hint">Enter a valid spacing / bar count greater than zero.</div>'; return; }
    if(!required){ out.innerHTML = '<div class="hint">Enter a valid comparison value.</div>'; return; }
    const pass = provided.value >= required.value;
    const margin = provided.value - required.value;
    out.innerHTML = `
      <div class="label">Provided Ast (${provided.desc})</div>
      <div class="big">${provided.value.toFixed(0)} ${provided.unit}</div>
      <div class="verdict ${pass?'ok':'bad'}">${pass ? 'PASS — provided ≥ required' : 'FAIL — provided < required'}</div>
      <div class="subresult"><span>Required (${required.desc})</span><span>${required.value.toFixed(0)} ${required.unit}</span></div>
      <div class="subresult"><span>Margin</span><span>${(margin>=0?'+':'')}${margin.toFixed(0)} ${provided.unit} (${required.value?((provided.value/required.value-1)*100).toFixed(1):'—'}%)</span></div>`;
  }
  [bar,sp,count,barCount,req].forEach(el=>el.addEventListener('input',calc));
  calc();
}

    <div class="result" id="scResult"></div>`;
  main.appendChild(c);

  const target = c.querySelector('#scTarget');
  const bar = c.querySelector('#scBar'), out = c.querySelector('#scResult');
  let targetMode = 'ref';

  targetModeSeg.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    targetMode = b.dataset.v;
    [...targetModeSeg.children].forEach(x=>x.classList.toggle('on', x===b));
    targetRefBox.style.display = targetMode==='ref' ? 'block':'none';
    targetValueBox.style.display = targetMode==='value' ? 'block':'none';

    if(targetMode==='value'){
      const t = parseFloat(target.value)||0;
      return t>0 ? {value:t, desc:'entered value'} : null;

    const b = BARS.find(x=>x.size==refBar.value);

  }
  [refBar,refSpacing,target,bar].forEach(el=>el.addEventListener('input',calc));
  calc();

    <label>Bar size</label>
    <select id="dcBar">${BARS.map(b=>`<option value="${b.size}">N${b.size}</option>`).join('')}</select>
    <label>Characteristic concrete strength f'c (MPa)</label>
    <select id="dcFc"><option>20</option><option>25</option><option selected>32</option><option>40</option><option>50</option><option>65</option></select>
    <label>Splice type</label>
    <div class="seg" id="dcType"><button class="on" data-v="tension">Tension</button><button data-v="compression">Compression</button></div>
    <div id="dcTensionInputs">
      <label>Bar orientation</label>
      <div class="seg" id="dcK1"><button class="on" data-v="1.0">Bottom-cast (k1=1.0)</button><button data-v="1.3">Top-cast, ≥300mm below (k1=1.3)</button></div>
      <label>Cover to bar, cd (mm)</label>
      <input type="number" id="dcCover" inputmode="decimal" value="40">
      <label>Clear spacing between bars (mm) — optional</label>
      <input type="number" id="dcSpacing" inputmode="decimal" placeholder="leave blank if unknown">
    </div>
    <div class="result" id="dcResult"></div>`;
  main.appendChild(c);

  const barSel = c.querySelector('#dcBar'), fcSel = c.querySelector('#dcFc');
  const typeSeg = c.querySelector('#dcType'), k1Seg = c.querySelector('#dcK1');
  const cover = c.querySelector('#dcCover'), spacing = c.querySelector('#dcSpacing');
  const tensionInputs = c.querySelector('#dcTensionInputs');
  const out = c.querySelector('#dcResult');
  let type='tension', k1=1.0;

  typeSeg.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
    type=b.dataset.v; [...typeSeg.children].forEach(x=>x.classList.toggle('on',x===b));
    tensionInputs.style.display = type==='tension' ? 'block':'none'; calc(); });
  k1Seg.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
    k1=parseFloat(b.dataset.v); [...k1Seg.children].forEach(x=>x.classList.toggle('on',x===b)); calc(); });

  function calc(){
    const db = parseFloat(barSel.value);
    const fc = parseFloat(fcSel.value);
    if(type==='tension'){
      const cv = parseFloat(cover.value)||db;
      const sp = spacing.value ? parseFloat(spacing.value) : null;
      const r = devLenTension({db,fc,k1,cover:cv,spacing:sp});
      out.innerHTML = `
        <div class="label">Basic development length, Lsy.tb</div>
        <div class="big">${Math.ceil(r.L)} mm</div>
        <div class="subresult"><span>k1 / k2 / k3</span><span>${k1.toFixed(2)} / ${r.k2.toFixed(2)} / ${r.k3.toFixed(2)}</span></div>
        <div class="subresult"><span>Effective cover, cd used</span><span>${r.cd.toFixed(0)} mm</span></div>
        <div class="subresult"><span>Calculated / minimum (0.058·fsy·k1·db)</span><span>${r.calc.toFixed(0)} / ${r.minLen.toFixed(0)} mm</span></div>`;
    } else {
      const r = devLenCompression({db,fc});
      out.innerHTML = `
        <div class="label">Basic compression development length, Lsy.cb</div>
        <div class="big">${Math.ceil(r.L)} mm</div>
        <div class="subresult"><span>Calculated / minimum (0.0435·fsy·db)</span><span>${r.calc.toFixed(0)} / ${r.minLen.toFixed(0)} mm</span></div>`;
    }
  }
  [barSel,fcSel,cover,spacing].forEach(el=>el.addEventListener('input',calc));
  calc();
}

/* ---------- Concrete: cover guide ---------- */
function renderCoverGuide(main){
  main.appendChild(disclaimer('Cover shown is nominal, indicative and simplified for common conditions only. The structural drawings and durability specification always govern — confirm exposure classification, concrete grade and nominal cover before pour approval.'));

  const c = document.createElement('div'); c.className='card';
  c.innerHTML = `<h2>Cover by environment</h2>${clauseTag('Ref. AS 3600:2018 Section 4 / Table 4.10.3.2')}`;
  COVER_ENV.forEach(row=>{
    const item = document.createElement('div');
    item.style.cssText='padding:12px 0; border-top:1px solid var(--border-soft);';
    item.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
        <b style="font-size:14px;">${row.env}</b>
        <span style="font-family:var(--mono); color:var(--amber-ink); font-weight:700; font-size:15px; white-space:nowrap;">${row.cover}</span>
      </div>
      <div class="pillrow"><span class="pl">Exposure: ${row.ec}</span><span class="pl">${row.fc}</span></div>
      <div style="font-size:12px; color:var(--text-dim); margin-top:6px; line-height:1.5;">${row.note}</div>`;
    c.appendChild(item);
  });
  main.appendChild(c);

  const c2 = document.createElement('div'); c2.className='card';
  c2.innerHTML = `<h2>Required cover vs f'c</h2>${clauseTag("Table 4.10.3.2 — standard formwork &amp; compaction")}
    <div class="table-wrap"><table>
      <thead><tr><th>Class</th>${COVER_TABLE.fc.map(f=>`<th>${f} MPa</th>`).join('')}</tr></thead>
      <tbody>${COVER_TABLE.rows.map(r=>`<tr><td>${r.ec}</td>${r.vals.map((v,i)=>`<td>${v===null?'—':(r.bracket[i]?`(${v})`:v)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="hint">Bracketed values require the strength-grade concession of Cl 4.3.2 — confirm applicability before use. Cover in mm.</div>`;
  main.appendChild(c2);
}

/* ---------- Concrete: defect library ---------- */
function renderDefectLib(main){
  main.appendChild(disclaimer('General identification guidance only. Any defect that may affect structural capacity, durability or cover must be assessed and dispositioned by the project structural engineer before acceptance or repair.'));
  const search = document.createElement('div'); search.className='searchbox';
  search.innerHTML = `<input type="text" id="defSearch" placeholder="Search defects…">`;
  main.appendChild(search);

  const list = document.createElement('div');
  main.appendChild(list);

  function build(filter){
    list.innerHTML='';
    const f = (filter||'').toLowerCase();
    DEFECTS.filter(d=> !f || d.name.toLowerCase().includes(f) || d.desc.toLowerCase().includes(f)).forEach((d,i)=>{
      const acc = document.createElement('div'); acc.className='accordion';
      acc.innerHTML = `
        <div class="head"><h3>${d.name}</h3><span class="chev">▾</span></div>
        <div class="body">
          <span class="tag">${d.tag}</span>
          <p><b>Description —</b> ${d.desc}</p>
          <p><b>Typical causes —</b> ${d.causes}</p>
          <p><b>On-site identification —</b> ${d.id}</p>
          <p><b>Remediation reference —</b> ${d.remediation}</p>
        </div>`;
      acc.querySelector('.head').addEventListener('click', ()=> acc.classList.toggle('open'));
      list.appendChild(acc);
    });
  }
  build('');
  search.querySelector('#defSearch').addEventListener('input', e=>build(e.target.value));
}

/* ---------- Checklist ---------- */
const CHK_KEY = 'sitecheck_rc_prepour_v1';
function loadChk(){
  try{ return JSON.parse(localStorage.getItem(CHK_KEY)) || {}; }catch(e){ return {}; }
}
function saveChk(data){ try{ localStorage.setItem(CHK_KEY, JSON.stringify(data)); }catch(e){} }

function genId(){ return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); }

function renderChecklist(main){
  let data = loadChk();
  if(!data.items) data.items = {};
  if(!data.meta) data.meta = {project:'', location:'', date:''};
  if(!data.custom) data.custom = {};
  if(!data.hidden) data.hidden = {};

  const metaCard = document.createElement('div'); metaCard.className='card';
  metaCard.innerHTML = `
    <h2>Pre-pour checklist</h2>
    ${clauseTag('Confirm against approved drawings before pour')}
    <div class="row2">
      <div><label>Project / element</label><input type="text" id="mProject" value="${data.meta.project||''}"></div>
      <div><label>Location / grid ref</label><input type="text" id="mLocation" value="${data.meta.location||''}"></div>
    </div>
    <label>Date</label>
    <input type="text" id="mDate" placeholder="e.g. 29/07/2026" value="${data.meta.date||''}">`;
  main.appendChild(metaCard);
  metaCard.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      data.meta = {
        project: metaCard.querySelector('#mProject').value,
        location: metaCard.querySelector('#mLocation').value,
        date: metaCard.querySelector('#mDate').value,
      };
      saveChk(data);
    });
  });

  const summary = document.createElement('div'); summary.className='chk-summary';
  main.appendChild(summary);

  function itemKey(g,i){ return g+'::'+i; }

  CHECKLIST_GROUPS.forEach(group=>{
    const gEl = document.createElement('div'); gEl.className='chk-group';
    gEl.innerHTML = `<h2>${group.name}</h2>`;
    let hiddenCount = 0;
    group.items.forEach((q,i)=>{
      const key = itemKey(group.name,i);
      if(data.hidden[key]){ hiddenCount++; return; }
      const entry = data.items[key] || {status:null, notes:''};
      const item = document.createElement('div'); item.className='chk-item';
      item.innerHTML = `
        <div style="display:flex; gap:8px; align-items:flex-start; margin-bottom:10px;">
          <div class="q" style="flex:1; margin-bottom:0;">${q}</div>
          <button class="std-del" aria-label="Delete item" style="flex-shrink:0; width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--fail); font-size:14px; font-weight:700; line-height:1;">✕</button>
        </div>
        <div class="status-btns">
          <button data-s="pass" class="pass ${entry.status==='pass'?'on':''}">PASS</button>
          <button data-s="fail" class="fail ${entry.status==='fail'?'on':''}">FAIL</button>
          <button data-s="hold" class="hold ${entry.status==='hold'?'on':''}">HOLD</button>
        </div>
        <textarea placeholder="Notes (optional)">${entry.notes||''}</textarea>`;
      item.querySelector('.std-del').addEventListener('click', ()=>{
        if(confirm('Remove this item from the checklist? You can restore it later from this section.')){
          data.hidden[key] = true;
          saveChk(data);
          render();
        }
      });
      item.querySelector('.status-btns').addEventListener('click', e=>{
        const b = e.target.closest('button'); if(!b) return;
        const cur = data.items[key] || {status:null, notes:''};
        cur.status = (cur.status===b.dataset.s) ? null : b.dataset.s;
        data.items[key] = cur;
        saveChk(data);
        item.querySelectorAll('.status-btns button').forEach(x=>x.classList.toggle('on', x.dataset.s===cur.status));
        updateSummary();
      });
      item.querySelector('textarea').addEventListener('input', e=>{
        const cur = data.items[key] || {status:null, notes:''};
        cur.notes = e.target.value;
        data.items[key] = cur;
        saveChk(data);
      });
      gEl.appendChild(item);
    });

    if(hiddenCount>0){
      const restore = document.createElement('button');
      restore.className = 'btn'; restore.style.cssText = 'width:100%; margin-bottom:10px; font-size:12px; padding:9px;';
      restore.textContent = `Restore ${hiddenCount} removed item${hiddenCount>1?'s':''}`;
      restore.addEventListener('click', ()=>{
        group.items.forEach((q,i)=>{ delete data.hidden[itemKey(group.name,i)]; });
        saveChk(data);
        render();
      });
      gEl.appendChild(restore);
    }

    if(!data.custom[group.name]) data.custom[group.name] = [];
    data.custom[group.name].forEach(entry=>{
      const item = document.createElement('div'); item.className='chk-item';
      item.innerHTML = `
        <div style="display:flex; gap:8px; align-items:flex-start; margin-bottom:10px;">
          <input type="text" class="custom-label" placeholder="Enter checklist item…" value="${(entry.text||'').replace(/"/g,'&quot;')}" style="flex:1; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14px; font-family:var(--sans); font-weight:600;">
          <button class="custom-del" aria-label="Delete item" style="flex-shrink:0; width:40px; height:40px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--fail); font-size:16px; font-weight:700;">✕</button>
        </div>
        <div class="status-btns">
          <button data-s="pass" class="pass ${entry.status==='pass'?'on':''}">PASS</button>
          <button data-s="fail" class="fail ${entry.status==='fail'?'on':''}">FAIL</button>
          <button data-s="hold" class="hold ${entry.status==='hold'?'on':''}">HOLD</button>
        </div>
        <textarea placeholder="Notes (optional)">${entry.notes||''}</textarea>`;
      item.querySelector('.custom-label').addEventListener('input', e=>{
        entry.text = e.target.value; saveChk(data);
      });
      item.querySelector('.custom-del').addEventListener('click', ()=>{
        if(confirm('Remove this checklist item?')){
          data.custom[group.name] = data.custom[group.name].filter(x=>x.id!==entry.id);
          saveChk(data);
          render();
        }
      });
      item.querySelector('.status-btns').addEventListener('click', e=>{
        const b = e.target.closest('button'); if(!b) return;
        entry.status = (entry.status===b.dataset.s) ? null : b.dataset.s;
        saveChk(data);
        item.querySelectorAll('.status-btns button').forEach(x=>x.classList.toggle('on', x.dataset.s===entry.status));
        updateSummary();
      });
      item.querySelector('textarea').addEventListener('input', e=>{
        entry.notes = e.target.value; saveChk(data);
      });
      gEl.appendChild(item);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'btn'; addBtn.style.cssText = 'width:100%; margin-top:2px;';
    addBtn.textContent = '+ Add item';
    addBtn.addEventListener('click', ()=>{
      data.custom[group.name].push({id:genId(), text:'', status:null, notes:''});
      saveChk(data);
      render();
    });
    gEl.appendChild(addBtn);

    main.appendChild(gEl);
  });

  const btnrow = document.createElement('div'); btnrow.className='btnrow';
  btnrow.innerHTML = `<button class="btn" id="chkExport">Export summary</button><button class="btn danger" id="chkReset">Reset</button>`;
  main.appendChild(btnrow);
  btnrow.querySelector('#chkExport').addEventListener('click', ()=> exportChecklist(data));
  btnrow.querySelector('#chkReset').addEventListener('click', ()=>{
    if(confirm('Clear all checklist entries for this inspection?')){
      localStorage.removeItem(CHK_KEY);
      render();
    }
  });

  function updateSummary(){
    let pass=0, fail=0, hold=0, total=0;
    CHECKLIST_GROUPS.forEach(g=>{
      g.items.forEach((q,i)=>{
        if(data.hidden[itemKey(g.name,i)]) return;
        total++;
        const s = (data.items[itemKey(g.name,i)]||{}).status;
        if(s==='pass') pass++; else if(s==='fail') fail++; else if(s==='hold') hold++;
      });
      (data.custom[g.name]||[]).forEach(entry=>{
        total++;
        if(entry.status==='pass') pass++; else if(entry.status==='fail') fail++; else if(entry.status==='hold') hold++;
      });
    });
    summary.innerHTML = `
      <div class="pill pass"><div class="n">${pass}</div><div class="l">Pass</div></div>
      <div class="pill fail"><div class="n">${fail}</div><div class="l">Fail</div></div>
      <div class="pill hold"><div class="n">${hold}</div><div class="l">Hold</div></div>
      <div class="pill"><div class="n">${total-pass-fail-hold}</div><div class="l">Open</div></div>`;
  }
  updateSummary();
}

function exportChecklist(data){
  let lines = [];
  lines.push('CONCRETE COMPANION — PRE-POUR CHECKLIST');
  lines.push(`Project: ${data.meta.project||'—'}`);
  lines.push(`Location: ${data.meta.location||'—'}`);
  lines.push(`Date: ${data.meta.date||'—'}`);
  lines.push('');
  CHECKLIST_GROUPS.forEach(g=>{
    lines.push(`## ${g.name}`);
    g.items.forEach((q,i)=>{
      if(data.hidden[g.name+'::'+i]) return;
      const e = data.items[g.name+'::'+i] || {};
      lines.push(`[${(e.status||'OPEN').toUpperCase()}] ${q}${e.notes?' — '+e.notes:''}`);
    });
    (data.custom[g.name]||[]).forEach(entry=>{
      if(!entry.text && !entry.status && !entry.notes) return;
      lines.push(`[${(entry.status||'OPEN').toUpperCase()}] ${entry.text||'(untitled item)'}${entry.notes?' — '+entry.notes:''}`);
    });
    lines.push('');
  });
  const text = lines.join('\n');
  if(navigator.share){
    navigator.share({title:'Pre-pour checklist', text}).catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  navigator.clipboard?.writeText(text).then(()=>{
    alert('Checklist summary copied to clipboard.');
  }).catch(()=>{
    alert(text);
  });
}

/* =====================================================================
   THEME
===================================================================== */
const THEME_KEY = 'concrete_companion_theme';
const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>';

function applyTheme(t){
  if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem(THEME_KEY, t);
  const btn = document.getElementById('themeToggle');
  if(btn) btn.innerHTML = (t==='dark') ? SUN_ICON : MOON_ICON; // icon shows what tapping switches TO... actually shows current-mode icon
}
function initTheme(){
  const saved = localStorage.getItem(THEME_KEY) || 'light';
  applyTheme(saved);
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme')==='dark' ? 'dark':'light';
    applyTheme(cur==='dark' ? 'light' : 'dark');
  });
}
initTheme();

/* =====================================================================
   INIT
===================================================================== */
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
